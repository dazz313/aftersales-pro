# ============================================================
# AfterSales Pro — CI (mutu kode)
# ============================================================
# Gate otomatis untuk setiap push & pull request:
#   1. Typecheck  (tsc --noEmit, setelah `next typegen`)
#   2. Lint       (eslint .)
#   3. Unit test  (vitest run)
# Tujuan: mencegah regresi tipe/aturan/uji masuk ke branch utama.
# Build desktop (MSI) punya workflow terpisah: build-desktop.yml.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          DATABASE_URL: 'file:./db/ci.db'

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: 'file:./db/ci.db'

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
