# ============================================================
# AfterSales Pro — E2E (Playwright)
# ============================================================
# Menjalankan uji end-to-end browser untuk alur kritis: kesehatan aplikasi,
# proteksi API, dan login. Memakai database SQLite terpisah (e2e/.tmp/e2e.db)
# yang dibuat & di-seed otomatis oleh e2e/prepare-db.mjs — tidak menyentuh
# db/custom.db. Gate mutu cepat (typecheck/lint/unit) ada di ci.yml.

name: E2E (Playwright)

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          DATABASE_URL: 'file:./db/ci.db'

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: 'file:./db/ci.db'

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload report saat gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
