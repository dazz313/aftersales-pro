# Hermes Agent (Nous Research) — Docker Compose
# Jalankan di server setelah user dazz masuk grup docker:
#   sudo usermod -aG docker dazz  (oleh admin/root)  lalu re-login SSH
#
# Penggunaan:
#   mkdir -p ~/.hermes
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose -f docker-compose.hermes.yml run --rm hermes setup
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose -f docker-compose.hermes.yml up -d
#
# Data persisten di ~/.hermes (config, .env, sessions, skills, memories).
# Port: 8642 (gateway API, perlu API_SERVER_ENABLED=true), 9119 (dashboard, perlu auth).
# Jangan bentrok dengan 3000 (AfterSales Pro) dan 20128 (9router).

services:
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HERMES_DATA:-/home/dazz/.hermes}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      # Dashboard dimatikan by default (butuh auth untuk bind non-loopback).
      # Aktifkan dengan HERMES_DASHBOARD=1 + set auth di config.yaml, atau
      # jalankan manual: docker exec hermes hermes dashboard --host 127.0.0.1 --no-open
      - HERMES_DASHBOARD=0
    command: ["gateway", "run"]
